<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Packer</title>
<!-- html-minifier-terser browser bundle (UMD, global HTMLMinifier; terser and clean-css included) -->
<script src="https://cdn.jsdelivr.net/npm/html-minifier-terser@7.2.0/dist/htmlminifier.umd.bundle.min.js"></script>
<!-- csso (classic script, global csso): the CSS minifier; clean-css, bundled with html-minifier, breaks :nth-child(1 of S) -->
<script src="https://cdn.jsdelivr.net/npm/csso@5.0.5/dist/csso.js"></script>
<!-- qrcode-generator (classic script, global qrcode) -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --line: #dde1e6; --text: #1d232b; --muted: #6b7480;
    --accent: #2f6fde; --good: #1f8a4c; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; }
  header span { color: var(--muted); font-size: 12px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px; }
  .col { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .grow { flex: 1; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .label { font-weight: 600; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-right: auto; }
  textarea { width: 100%; flex: 1; min-height: 60px; resize: none; border: 1px solid var(--line); border-radius: 4px; padding: 6px;
             font: 12px/1.35 var(--mono); color: var(--text); background: #fbfcfd; }
  #src.drag { border-color: var(--accent); background: #eef4ff; }
  button { font: inherit; padding: 4px 12px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--text); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .note { color: var(--muted); font-size: 12px; white-space: pre-line; } /* a \n in a note starts a new line */
  .note:empty { display: none; } /* an empty note takes no room (no line, no gap) */
  progress { width: 140px; height: 8px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td, th { padding: 2px 6px; text-align: right; border-bottom: 1px solid var(--line); }
  td:first-child, th:first-child { text-align: left; }
  th { font-weight: 600; color: var(--muted); font-size: 12px; }
  tr.win td { color: var(--good); font-weight: 600; }
  #qr { align-self: flex-start; width: 160px; image-rendering: pixelated; }
  iframe { flex: 1; min-height: 120px; width: 100%; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>HTML Packer v0.4.7</h1> <!-- the version, bumped with each release; each release commit gets the tag v<version> -->
  <span>Paste or drop an HTML file, or a whole folder: its scripts, styles and files go inside the page; then minify, deflate or Roadroller; the smallest is kept.</span>
</header>
<main>
  <div class="col">
    <div class="card grow">
      <div class="row">
        <span class="label">Input</span>
        <button id="open" title="One .html file, or an .html file with the files it uses">Open files…</button>
        <button id="openDir" title="A folder: its index.html (or shallowest .html) with every file beside it">Open folder…</button>
        <input id="file" type="file" multiple hidden>
        <input id="dir" type="file" webkitdirectory hidden>
      </div>
      <div id="files" class="note row"></div>
      <textarea id="src" spellcheck="false" placeholder="Paste HTML here, or drop an .html file or a folder"></textarea>
    </div>
    <div class="card">
      <div class="row">
        <label title="CompressionStream deflate-raw + base64, inflated when the page opens"><input type="checkbox" id="optDeflate" checked> Deflate</label>
        <label title="Roadroller packer (slow: several seconds, in a worker)"><input type="checkbox" id="optRoad"> Roadroller</label>
        <label title="Terser: toplevel mangle, passes:3, unsafe; and removal of default attributes (type=text…). May break code sharing global names across scripts or with onclick attributes, and CSS or JS selecting on those attributes"><input type="checkbox" id="optAggr"> Aggressive</label>
        <button id="run" class="primary" style="margin-left:auto">Compact</button>
      </div>
      <div class="row"><span id="status" class="note"></span><progress id="prog" max="1" value="0" hidden></progress></div>
      <table id="sizes">
        <thead><tr><th>Step</th><th>HTML (bytes)</th><th>URI (bytes)</th><th>Ratio</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <div class="col">
    <div class="card grow">
      <div class="row">
        <span class="label">Final HTML</span>
        <button id="copyHtml" disabled>Copy</button>
        <button id="download" disabled>Download</button>
      </div>
      <textarea id="outHtml" readonly spellcheck="false"></textarea>
    </div>
    <div class="card">
      <div class="row">
        <span class="label">data: URI (to paste as a URL)</span>
        <button id="copyUri" disabled>Copy</button>
        <button id="dlQr" disabled>Download QR</button>
      </div>
      <textarea id="outUri" readonly spellcheck="false" style="flex:none;height:60px"></textarea>
      <canvas id="qr" hidden></canvas>
      <span id="uriNote" class="note"></span>
    </div>
    <div class="card grow">
      <div class="row"><span class="label">Preview (sandboxed iframe)</span></div>
      <iframe id="preview" sandbox="allow-scripts allow-pointer-lock"></iframe>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const ROADROLLER_URL = 'https://cdn.jsdelivr.net/npm/roadroller@2.1.0/+esm';
const bytes = s => new TextEncoder().encode(s).length;

let fileName = 'page.html';
let assets = new Map(); // files beside the page: path relative to the page's folder → { file, on: served to fetch(), bytes once read }
let runId = 0;        // each run gets an id; results of a stale run are dropped
let worker = null;    // the Roadroller worker of the current run

/* ---- Inline the page's files -------------------------------------------- */

const MIME = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml',
  ico: 'image/x-icon', mp3: 'audio/mpeg', ogg: 'audio/ogg', wav: 'audio/wav', mp4: 'video/mp4', webm: 'video/webm',
  json: 'application/json', js: 'text/javascript', mjs: 'text/javascript', css: 'text/css', html: 'text/html', htm: 'text/html',
  txt: 'text/plain', wasm: 'application/wasm', woff: 'font/woff', woff2: 'font/woff2', ttf: 'font/ttf' };
const mime = path => MIME[(path.match(/\.([^./]+)$/) || [])[1]?.toLowerCase()] || 'application/octet-stream';

// A relative URL → its asset key (path from the page's folder); null for absolute URLs.
// The packed page's fetch shim resolves the very same way (fake origin http://a/).
function assetKey(ref) {
  try {
    const u = new URL(ref, 'http://a/');
    return u.origin === 'http://a' ? decodeURIComponent(u.pathname.slice(1)) : null;
  } catch { return null; }
}

const embedded = () => [...assets].filter(([, a]) => a.on);

// A file is read only when it goes in (a project folder may hold megabytes the page never uses)
const bytesOf = async a => a.bytes ??= new Uint8Array(await a.file.arrayBuffer());

// Ticked when loaded: the files in the page's own folder, except documents (licence, readme…).
// Subfolders start unticked: tools, older versions, other pages; a file the page links to is taken anyway.
const isDoc = path => /(^|\/)(license|licence|readme|changelog|copying)(\.[^/]*)?$|\.md$/i.test(path);
const tickedFirst = key => !key.includes('/') && !isDoc(key);

const size = n => n < 1000 ? n + ' B' : (n / (n < 1e6 ? 1e3 : 1e6)).toLocaleString('en', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + (n < 1e6 ? ' KB' : ' MB');

// The fetch shim, put first in the page when files are left over: fetch() of one of them answers from the page.
// files: { key: [mime, base64] }, or with binary: { key: [mime, start, end] } in the inflated bytes B (see packDeflateFiles)
const fetchShim = (files, binary) => '{let A=' + JSON.stringify(files) + ',F=fetch;fetch=(r,o)=>{let u=new URL(r.url||r,"http://a/"),' +
  'a=u.origin=="http://a"&&A[decodeURIComponent(u.pathname.slice(1))];return a?Promise.resolve(new Response(' +
  (binary ? 'B.slice(a[1],a[2])' : 'Uint8Array.from(atob(a[1]),c=>c.charCodeAt(0))') + ',{headers:{"Content-Type":a[0]}})):F(r,o)}}';

const textShim = served => served.length ? fetchShim(Object.fromEntries(served.map(k => [k, [mime(k), base64(assets.get(k).bytes)]]))) : '';

// [doctype, rest]: what goes before a script put first in the page
const splitDoctype = html => { const d = (html.match(/^<!doctype[^>]*>/i) || [''])[0]; return [d, html.slice(d.length)]; };

// A script before <html> lands first in <head>, as the parser builds it
function withShim(html, shim) {
  if (!shim) return html;
  const [doctype, rest] = splitDoctype(html);
  return doctype + '<script>' + shim + '</' + 'script>' + rest;
}

// Scripts and stylesheets go inline, media become data: URIs (the files the page links to, ticked or not);
// returns the page, those files, and the ticked files left for the fetch shim
async function inlineAssets(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const used = new Set();
  const take = async ref => { const k = assetKey(ref || ''), a = k != null && assets.get(k); if (a) { used.add(k); return [k, await bytesOf(a)]; } };
  const text = u8 => new TextDecoder().decode(u8);
  for (const s of doc.querySelectorAll('script[src]')) {
    const a = await take(s.getAttribute('src'));
    if (!a) continue;
    s.removeAttribute('src');
    s.textContent = text(a[1]).replace(/<\/(script)/gi, '<\\/$1');
    // an inline classic script ignores defer: run it after parsing, as before
    if (s.defer && s.type !== 'module') { s.removeAttribute('defer'); doc.body.append(s); }
  }
  for (const l of doc.querySelectorAll('link[rel~=stylesheet][href]')) {
    const a = await take(l.getAttribute('href'));
    if (!a) continue;
    const style = doc.createElement('style');
    if (l.media) style.media = l.media;
    style.textContent = text(a[1]).replace(/<\/(style)/gi, '<\\/$1');
    l.replaceWith(style);
  }
  for (const m of doc.querySelectorAll('img[src], audio[src], video[src], source[src], link[rel~=icon][href]')) {
    const attr = m.hasAttribute('src') ? 'src' : 'href';
    const a = await take(m.getAttribute(attr));
    if (a) m.setAttribute(attr, 'data:' + mime(a[0]) + ';base64,' + base64(a[1]));
  }
  const doctype = doc.doctype ? '<!DOCTYPE ' + doc.doctype.name + '>' : '';
  const served = embedded().map(([k]) => k).filter(k => !used.has(k));
  for (const k of served) await bytesOf(assets.get(k));
  return { html: doctype + doc.documentElement.outerHTML, used: [...used], served };
}

/* ---- Minify ------------------------------------------------------------ */

// CSS by csso rather than html-minifier's clean-css, which glues ":nth-child(1 of :not([hidden]))" into "1of:",
// so the browser drops the whole rule (Tessera lost 7 of its 9 such rules, its +10k button showed through).
// type: 'inline' for a style attribute, 'media' for a media attribute, none for a stylesheet.
function minifyCSS(text, type) {
  try {
    return type === 'inline' ? csso.minifyBlock(text).css : type === 'media' ? text.trim() : csso.minify(text).css;
  } catch { return text; }
}

// html-minifier-terser options. "Aggressive" adds what can break a page: Terser's toplevel mangle, passes:3 and
// unsafe (never property mangling), and removeRedundantAttributes, which drops type=text and the like that CSS
// or JS may select on (input[type=text]: Tessera's number field lost its style)
function minifyOptions(aggressive) {
  const terser = aggressive
    ? { compress: { passes: 3, unsafe: true }, mangle: { toplevel: true } }
    : { compress: true, mangle: true };
  return {
    collapseWhitespace: true,
    removeComments: true,
    removeAttributeQuotes: true,
    removeRedundantAttributes: aggressive,
    collapseBooleanAttributes: true,
    useShortDoctype: true,
    removeScriptTypeAttributes: true,
    removeStyleLinkTypeAttributes: true,
    sortAttributes: true,
    sortClassName: true,
    minifyCSS,
    minifyJS: terser,
  };
}

/* ---- Packers ----------------------------------------------------------- */

function base64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}

async function deflate64(blob) {
  const stream = blob.stream().pipeThrough(new CompressionStream('deflate-raw'));
  return base64(new Uint8Array(await new Response(stream).arrayBuffer()));
}

async function packDeflate(html) {
  return '<script>(async()=>document.write(await new Response((await fetch("data:;base64,' + await deflate64(new Blob([html])) +
    '")).body.pipeThrough(new DecompressionStream("deflate-raw"))).text()))()</' + 'script>';
}

// With files for the fetch shim, deflate carries them as raw bytes (not base64 inside the base64), in a stream of
// their own: binary and text in one deflate stream share Huffman tables and cost ~10 % more (Q1K3: 14,940 B against
// 13,407 B apart), and CompressionStream cannot end a block. The loader keeps the files' bytes in B
// (document.write keeps the window, so B stays) and writes the page.
async function packDeflateFiles(html, served) {
  const files = {}, parts = [];
  let at = 0;
  for (const k of served) { const b = assets.get(k).bytes; files[k] = [mime(k), at, at += b.length]; parts.push(b); }
  const page = withShim(html, fetchShim(files, true));
  return '<script>(async()=>{let i=async s=>new Response((await fetch("data:;base64,"+s)).body.pipeThrough(new DecompressionStream("deflate-raw")));' +
    'B=new Uint8Array(await(await i("' + await deflate64(new Blob(parts)) + '")).arrayBuffer());' +
    'document.write(await(await i("' + await deflate64(new Blob([page])) + '")).text())})()</' + 'script>';
}

// Roadroller runs in a Web Worker made from a Blob, so the UI stays responsive.
// A classic worker with a dynamic import(): from file:// Chrome refuses Blob *module* workers.
const WORKER_SRC = `
onmessage = async ({ data: html }) => {
  try {
    const { Packer } = await import('${ROADROLLER_URL}');
    const packer = new Packer([{ data: html, type: 'text', action: 'write' }], {});
    await packer.optimize(1, info => { postMessage({ progress: info.passRatio ?? 0, pass: info.pass, best: info.bestSize }); });
    const { firstLine, secondLine } = packer.makeDecoder();
    postMessage({ done: firstLine + secondLine });
  } catch (e) { postMessage({ error: String(e && e.message || e) }); }
};`;

// Roadroller's document.write runs while the page is still parsing (unlike the async deflate loader):
// a written doctype would come too late (quirks mode) and the loader <script> would stay in the DOM.
// So the doctype goes before the script, and the script removes itself.
async function packRoadroller(html, onProgress) {
  const [doctype, rest] = splitDoctype(html);
  const code = await runRoadroller(rest, onProgress);
  return doctype + '<script>' + code + ';document.currentScript.remove()</' + 'script>';
}

function runRoadroller(html, onProgress) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
    worker = new Worker(url);
    URL.revokeObjectURL(url);
    worker.onerror = e => reject(new Error(e.message || 'could not load the Roadroller worker'));
    worker.onmessage = ({ data }) => {
      if (data.error) reject(new Error(data.error));
      else if (data.done) resolve(data.done);
      else onProgress(data);
    };
    worker.postMessage(html);
  });
}

function stopWorker() { if (worker) { worker.terminate(); worker = null; } }

/* ---- Outputs ----------------------------------------------------------- */

// data: URI, percent-encoding only what breaks it: %, # and line breaks
const dataUri = html => 'data:text/html,' + html.replace(/%/g, '%25').replace(/#/g, '%23').replace(/\r/g, '%0D').replace(/\n/g, '%0A');

function setStatus(text, ratio) {
  $('status').textContent = text;
  $('prog').hidden = ratio == null;
  if (ratio != null) $('prog').value = ratio;
}

// rows: [{ name, html }], the smallest final candidate wins
function render(rawSize, minSize, candidates) {
  const ratio = n => (100 * n / rawSize).toFixed(1) + ' %';
  const tb = $('sizes').tBodies[0];
  tb.innerHTML = '';
  const row = (name, h, u, cls) => {
    const tr = tb.insertRow();
    if (cls) tr.className = cls;
    [name, h.toLocaleString('en'), u == null ? '' : u.toLocaleString('en'), ratio(h)].forEach(t => tr.insertCell().textContent = t);
  };
  row('Raw', rawSize);
  row('Minified', minSize);
  const sized = candidates.map(c => ({ ...c, size: bytes(c.html), uri: dataUri(c.html) }));
  const best = sized.reduce((a, b) => (b.size < a.size ? b : a));
  for (const c of sized) row('Final · ' + c.name + (c === best ? ' ✓' : ''), c.size, bytes(c.uri), c === best ? 'win' : '');
  $('outHtml').value = best.html;
  $('outUri').value = best.uri;
  $('preview').srcdoc = best.html;
  showQr(best.uri);
  ['copyHtml', 'download', 'copyUri'].forEach(id => $(id).disabled = false);
  return best;
}

/* ---- QR code of the data: URI ------------------------------------------ */

const QR_MAX = 2953; // bytes held by the largest QR code (version 40, byte mode, error correction L)
// The longest data: URI each browser takes as a pasted URL, each checked on its own:
// - Chromium (Chrome, Edge, Brave): its address bar keeps 512,000 characters of a paste (measured with Tessera:
//   location.href.length was 512,000 for a 613,019-character URI); a link or a navigation goes up to 2 MiB.
// - Firefox: 32 MiB from Firefox 97 to 135, 512 MiB since 136 (MDN, data: URLs); Waterfox follows an older ESR, so 32 MiB.
// - Safari (WebKit): 2,048 MiB (MDN). Firefox, Waterfox and Safari opened Tessera's whole 613,019-character paste.
const PASTE_LIMITS = [
  { browsers: 'Chrome, Edge or Brave', max: 512000, shown: '512,000 characters' },
  { browsers: 'Firefox or Waterfox', max: 32 * 2 ** 20, shown: '32 MiB' },
  { browsers: 'Safari', max: 2048 * 2 ** 20, shown: '2,048 MiB' },
];

function showQr(uri) {
  const n = bytes(uri);
  // shown in place of the QR code; the button's tooltip gives the detail
  const why = typeof qrcode === 'undefined' ? '[QR code library not loaded]'
    : n > QR_MAX ? '[' + size(n - QR_MAX) + ' too many to fit a QR code]' : '';
  const canvas = $('qr');
  canvas.hidden = !!why;
  $('dlQr').disabled = !!why;
  $('dlQr').title = !why ? 'PNG of the QR code' : n > QR_MAX
    ? 'No QR code: the URI is ' + n.toLocaleString('en') + ' bytes, a QR code holds ' + QR_MAX.toLocaleString('en') + ' at most' : 'No QR code: ' + why;
  // under the URI, one line per limit it passes: the QR code's, then each browser's
  const paste = PASTE_LIMITS.filter(l => uri.length > l.max)
    .map(l => '[' + size(uri.length - l.max) + ' too many to paste as a URL in ' + l.browsers + ' (' + l.shown + ' at most)]');
  $('uriNote').textContent = [why, ...paste].filter(Boolean).join('\n');
  if (why) return;
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  const qr = qrcode(0, 'L');
  qr.addData(uri, 'Byte');
  qr.make();
  const count = qr.getModuleCount(), quiet = 4, scale = 4; // a 4-module quiet zone, as the standard asks
  canvas.width = canvas.height = (count + 2 * quiet) * scale;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#000';
  for (let r = 0; r < count; r++)
    for (let c = 0; c < count; c++) if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
}

/* ---- Run --------------------------------------------------------------- */

async function run() {
  const src = $('src').value;
  if (!src.trim()) return;
  const id = ++runId;
  stopWorker();
  setStatus('Minifying…');
  const { html: page, used, served } = assets.size ? await inlineAssets(src) : { html: src, used: [], served: [] };
  if (id !== runId) return;
  let bare;
  try {
    bare = await HTMLMinifier.minify(page, minifyOptions($('optAggr').checked));
  } catch (e) { if (id === runId) setStatus('Minify error: ' + (e.message || e)); return; }
  if (id !== runId) return;
  // the shim is written minified already: it joins after the minifier, as text (base64) or, in deflate, as raw bytes
  const min = withShim(bare, textShim(served));
  const rawSize = bytes(src) + [...used, ...served].reduce((n, k) => n + assets.get(k).file.size, 0), minSize = bytes(min);
  // the minified page itself is a candidate too: on tiny pages the loader costs more than it saves
  const candidates = [{ name: 'minified only', html: min }];
  if ($('optDeflate').checked) candidates.push({ name: 'deflate', html: served.length ? await packDeflateFiles(bare, served) : await packDeflate(min) });
  if (id !== runId) return;
  let best = render(rawSize, minSize, candidates);
  if (!$('optRoad').checked) { setStatus('Kept: ' + best.name); return; }
  setStatus('Roadroller: loading…', 0);
  const t0 = performance.now();
  try {
    const html = await packRoadroller(min, p => {
      if (id === runId) setStatus('Roadroller: ' + (p.pass || 'optimizing') + (p.best ? ' · best ' + p.best + ' B' : ''), p.progress);
    });
    if (id !== runId) return;
    candidates.push({ name: 'Roadroller', html });
    best = render(rawSize, minSize, candidates);
    setStatus('Roadroller: ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s. Kept: ' + best.name);
  } catch (e) {
    if (id === runId) setStatus('Roadroller error: ' + e.message + '. Kept: ' + best.name);
  } finally { if (id === runId) stopWorker(); }
}

/* ---- Input and buttons --------------------------------------------------- */

// One box per file beside the page, and one per subfolder (all its files): ticked, it goes inside the page
function showFiles() {
  const box = $('files');
  box.replaceChildren();
  if (!assets.size) return;
  box.append(fileName + ' +');
  const groups = new Map();
  for (const [k, a] of assets) {
    const g = k.includes('/') ? k.slice(0, k.indexOf('/') + 1) : k;
    groups.set(g, [...(groups.get(g) || []), a]);
  }
  for (const [g, files] of groups) {
    const label = document.createElement('label');
    const input = Object.assign(document.createElement('input'), { type: 'checkbox', checked: files.every(a => a.on) });
    input.indeterminate = !input.checked && files.some(a => a.on);
    input.onchange = () => { files.forEach(a => a.on = input.checked); run(); };
    const total = size(files.reduce((n, a) => n + a.file.size, 0));
    label.title = g.endsWith('/') ? 'Unticked when loaded: a subfolder (tools, older versions, other pages). The files the page links to are inside anyway'
      : isDoc(g) ? 'Unticked when loaded: a document file that pages rarely fetch' : 'Inside the page when ticked';
    label.append(input, ' ' + g + ' (' + (g.endsWith('/') ? files.length + ' files, ' : '') + total + ')');
    box.append(label);
  }
}

// list: [{ path, file }], paths relative to what was dropped or opened. The page is the shallowest
// .html (index.html first); the files in its folder and below become its assets (read only when they go in);
// hidden files are skipped.
async function loadFiles(list) {
  list = list.filter(f => !f.path.split('/').some(p => p.startsWith('.')));
  const depth = f => f.path.split('/').length;
  const isIndex = f => /(^|\/)index\.html?$/i.test(f.path);
  const main = list.filter(f => /\.html?$/i.test(f.path)).sort((a, b) => depth(a) - depth(b) || isIndex(b) - isIndex(a))[0];
  if (!main) { setStatus('No .html file among the files'); return; }
  const dir = main.path.slice(0, main.path.lastIndexOf('/') + 1);
  assets = new Map();
  for (const f of list) {
    if (f === main || !f.path.startsWith(dir)) continue;
    const key = f.path.slice(dir.length);
    assets.set(key, { file: f.file, on: tickedFirst(key) });
  }
  fileName = main.file.name;
  $('src').value = await main.file.text();
  showFiles();
  run();
}

// A dropped folder is walked through its entries (DataTransfer.files lists no folder content)
async function entryFiles(entry, out) {
  if (entry.name.startsWith('.')) return out; // hidden: .git and the like are not even walked
  if (entry.isFile) out.push({ path: entry.fullPath.slice(1), file: await new Promise((ok, ko) => entry.file(ok, ko)) });
  else if (entry.isDirectory) {
    const reader = entry.createReader();
    for (let batch; (batch = await new Promise((ok, ko) => reader.readEntries(ok, ko))).length;)
      for (const e of batch) await entryFiles(e, out);
  }
  return out;
}

const pickedFiles = input => [...input.files].map(file => ({ path: file.webkitRelativePath || file.name, file }));

const src = $('src');
src.addEventListener('dragover', e => { e.preventDefault(); src.classList.add('drag'); });
src.addEventListener('dragleave', () => src.classList.remove('drag'));
src.addEventListener('drop', async e => {
  e.preventDefault();
  src.classList.remove('drag');
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const list = [];
  for (const entry of entries) await entryFiles(entry, list);
  loadFiles(list);
});
src.addEventListener('paste', () => { fileName = 'page.html'; assets = new Map(); showFiles(); setTimeout(run, 0); });
src.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) run(); });
$('open').onclick = () => $('file').click();
$('openDir').onclick = () => $('dir').click();
$('file').onchange = e => loadFiles(pickedFiles(e.target));
$('dir').onchange = e => loadFiles(pickedFiles(e.target));
$('run').onclick = run;
['optDeflate', 'optRoad', 'optAggr'].forEach(id => $(id).onchange = run);

async function copy(text, btn) {
  await navigator.clipboard.writeText(text);
  const t = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = t, 1000);
}
$('copyHtml').onclick = e => copy($('outHtml').value, e.target);
$('copyUri').onclick = e => copy($('outUri').value, e.target);
function save(blob, suffix) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName.replace(/\.html?$/i, '') + suffix;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('download').onclick = () => save(new Blob([$('outHtml').value], { type: 'text/html' }), '.min.html');
$('dlQr').onclick = () => $('qr').toBlob(blob => save(blob, '.qr.png'));
</script>
</body>
