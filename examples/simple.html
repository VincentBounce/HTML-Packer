<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Simple page</title>
</head>
<body>
  <!-- A plain page: headings, lists, a table, a form, a few non-ASCII characters -->
  <h1 id="top">Hello, café &amp; naïve résumé</h1>
  <p class="intro">This is a   <em>simple</em>   page, with some <strong>text</strong> and an <a href="#bottom">internal link</a>.</p>
  <ul>
    <li>First item</li>
    <li>Second item</li>
    <li>Third   item</li>
  </ul>
  <table border="1">
    <thead><tr><th>Name</th><th>Value</th></tr></thead>
    <tbody>
      <tr><td>alpha</td><td>1</td></tr>
      <tr><td>beta</td><td>2 %</td></tr>
    </tbody>
  </table>
  <form action="#" method="get">
    <label for="q">Search</label>
    <input type="text" id="q" name="q" value="">
    <input type="checkbox" checked="checked" disabled="disabled"> checked
    <button type="submit">OK</button>
  </form>
  <p id="bottom">The end — 100 % done, #end.</p>
</body>
</html>
