<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Canvas demo</title>
  <style>
    body { margin: 0; background: #101418; color: #e8e8e8; font-family: sans-serif; }
    canvas { display: block; margin: 16px auto; border: 1px solid #333; }
    #info { text-align: center; font-size: 13px; }
  </style>
</head>
<body>
  <canvas id="c" width="480" height="320"></canvas>
  <p id="info">rendering…</p>
  <script>
    // Deterministic procedural scene: seeded PRNG, value noise terrain, stars, trees, a sun.
    // Drawn once, synchronously, so two runs give the very same pixels.

    // ---- Seeded random (mulberry32) ----
    function makeRandom(seed) {
      let state = seed >>> 0;
      return function random() {
        state = (state + 0x6D2B79F5) >>> 0;
        let t = state;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // ---- 1D value noise with smooth interpolation ----
    function makeNoise(random, size) {
      const values = [];
      for (let i = 0; i < size; i++) values.push(random());
      function smoothstep(x) { return x * x * (3 - 2 * x); }
      return function noise(x) {
        const i = Math.floor(x);
        const fraction = x - i;
        const a = values[((i % size) + size) % size];
        const b = values[(((i + 1) % size) + size) % size];
        return a + (b - a) * smoothstep(fraction);
      };
    }

    function fractalNoise(noise, x, octaves) {
      let total = 0, amplitude = 1, frequency = 1, norm = 0;
      for (let octave = 0; octave < octaves; octave++) {
        total += noise(x * frequency) * amplitude;
        norm += amplitude;
        amplitude *= 0.5;
        frequency *= 2;
      }
      return total / norm;
    }

    // ---- Colour helpers ----
    function mixColour(colourA, colourB, amount) {
      const result = [];
      for (let channel = 0; channel < 3; channel++) {
        result.push(Math.round(colourA[channel] + (colourB[channel] - colourA[channel]) * amount));
      }
      return 'rgb(' + result.join(',') + ')';
    }

    // ---- Scene parts ----
    function drawSky(context, width, height) {
      const gradient = context.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, '#0b1a3a');
      gradient.addColorStop(0.6, '#3a4f8a');
      gradient.addColorStop(1, '#e89a6a');
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);
    }

    function drawStars(context, random, width, height, count) {
      for (let index = 0; index < count; index++) {
        const x = Math.floor(random() * width);
        const y = Math.floor(random() * height * 0.5);
        const brightness = 150 + Math.floor(random() * 105);
        context.fillStyle = 'rgb(' + brightness + ',' + brightness + ',' + brightness + ')';
        context.fillRect(x, y, 1, 1);
      }
    }

    function drawSun(context, x, y, radius) {
      for (let ring = 6; ring >= 1; ring--) {
        context.beginPath();
        context.arc(x, y, radius * (1 + ring * 0.25), 0, Math.PI * 2);
        context.fillStyle = 'rgba(255, 200, 120, ' + (0.05 * (7 - ring)).toFixed(2) + ')';
        context.fill();
      }
      context.beginPath();
      context.arc(x, y, radius, 0, Math.PI * 2);
      context.fillStyle = '#ffd890';
      context.fill();
    }

    function drawMountainLayer(context, noise, width, height, baseLine, amplitude, scale, colour) {
      context.beginPath();
      context.moveTo(0, height);
      for (let x = 0; x <= width; x += 2) {
        const elevation = fractalNoise(noise, x / scale, 4);
        context.lineTo(x, baseLine - elevation * amplitude);
      }
      context.lineTo(width, height);
      context.closePath();
      context.fillStyle = colour;
      context.fill();
    }

    function drawTree(context, x, groundY, treeHeight, colour) {
      context.fillStyle = '#2a1a10';
      context.fillRect(x - 1, groundY - treeHeight * 0.25, 2, treeHeight * 0.25);
      context.beginPath();
      context.moveTo(x, groundY - treeHeight);
      context.lineTo(x - treeHeight * 0.3, groundY - treeHeight * 0.2);
      context.lineTo(x + treeHeight * 0.3, groundY - treeHeight * 0.2);
      context.closePath();
      context.fillStyle = colour;
      context.fill();
    }

    function drawForest(context, random, width, groundY, count) {
      for (let index = 0; index < count; index++) {
        const x = Math.floor(random() * width);
        const treeHeight = 12 + Math.floor(random() * 18);
        const shade = random();
        drawTree(context, x, groundY + Math.floor(random() * 10), treeHeight, mixColour([20, 60, 30], [40, 90, 50], shade));
      }
    }

    // ---- Main ----
    function render(seed) {
      const canvas = document.getElementById('c');
      const context = canvas.getContext('2d');
      const width = canvas.width, height = canvas.height;
      const random = makeRandom(seed);
      const noise = makeNoise(random, 64);

      drawSky(context, width, height);
      drawStars(context, random, width, height, 160);
      drawSun(context, width * 0.72, height * 0.55, 22);

      const layers = [
        { baseLine: 0.70, amplitude: 110, scale: 90, colour: [70, 80, 120] },
        { baseLine: 0.80, amplitude: 80, scale: 60, colour: [45, 55, 85] },
        { baseLine: 0.92, amplitude: 50, scale: 40, colour: [25, 35, 50] },
      ];
      for (const layer of layers) {
        drawMountainLayer(context, noise, width, height, height * layer.baseLine, layer.amplitude, layer.scale,
          mixColour(layer.colour, [232, 154, 106], 0.15));
      }
      drawForest(context, random, width, height * 0.92, 70);

      // A small checksum of the pixels, shown in the DOM, so the DOM comparison sees the drawing too
      const pixels = context.getImageData(0, 0, width, height).data;
      let checksum = 0;
      for (let index = 0; index < pixels.length; index += 4) checksum = (checksum * 31 + pixels[index] + pixels[index + 1] * 3 + pixels[index + 2] * 7) >>> 0;
      document.getElementById('info').textContent = 'seed ' + seed + ' · checksum ' + checksum.toString(16);
    }

    render(1337);
  </script>
</body>
</html>
